<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sponsors · VOCA</title>
  <meta name="description" content="VOCA sponsors and how your business can support Odia culture in BC." />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaina+2:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+Oriya:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="sponsors">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <img class="page-hero-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Lingaraj_Temple_%2C_Bhubaneswar.jpg/1920px-Lingaraj_Temple_%2C_Bhubaneswar.jpg" alt="" aria-hidden="true" />
      <div class="wrap page-hero-content">
        <p class="kicker light" data-i18n="spKicker"></p>
        <h1 data-i18n="spTitle"></h1>
        <p data-i18n="spSub"></p>
      </div>
      <div class="ikat-band" aria-hidden="true"></div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="tiers" id="tiers"></div>
      </div>
    </section>
    <section class="section sponsor-why" id="become">
      <div class="wrap form-layout">
        <aside class="form-aside reveal">
          <h2 data-i18n="spWhyTitle"></h2>
          <ul class="benefits"><li data-i18n="w1"></li><li data-i18n="w2"></li><li data-i18n="w3"></li></ul>
          <svg class="aside-wheel" viewBox="0 0 100 100" aria-hidden="true"><use href="#wheel" /></svg>
        </aside>
        <form class="form-card reveal" data-form="Sponsorship enquiry" novalidate>
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <h2 data-i18n="spFormTitle"></h2>
          <div class="grid-2">
            <label class="field"><span class="lbl"><span data-i18n="fBusiness"></span> <em>*</em></span><input type="text" name="business" required autocomplete="organization" /></label>
            <label class="field"><span class="lbl"><span data-i18n="fContact"></span> <em>*</em></span><input type="text" name="name" required autocomplete="name" /></label>
            <label class="field"><span class="lbl"><span data-i18n="fEmail"></span> <em>*</em></span><input type="email" name="email" required autocomplete="email" /></label>
            <label class="field"><span class="lbl"><span data-i18n="fPhone"></span></span><input type="tel" name="phone" /></label>
          </div>
          <label class="field"><span class="lbl"><span data-i18n="fWebsite"></span></span><input type="url" name="website" placeholder="https://" /></label>
          <div class="field"><span class="lbl"><span data-i18n="fTier"></span></span>
            <div class="check-pills"><label class="check-pill"><input type="radio" name="tier" value="Platinum" /><span data-i18n="tierPlatinum"></span></label><label class="check-pill"><input type="radio" name="tier" value="Gold" /><span data-i18n="tierGold"></span></label><label class="check-pill"><input type="radio" name="tier" value="Silver" /><span data-i18n="tierSilver"></span></label><label class="check-pill"><input type="radio" name="tier" value="Community partners" /><span data-i18n="tierCommunity"></span></label></div>
          </div>
          <label class="field"><span class="lbl"><span data-i18n="fMessage"></span></span><textarea name="message" rows="4"></textarea></label>
          <button type="submit" class="btn btn-primary" data-i18n="spSubmit"></button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/odisha.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
