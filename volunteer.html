<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volunteer & contribute · VOCA</title>
  <meta name="description" content="Volunteer with VOCA or contribute to Odia cultural events in Metro Vancouver." />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaina+2:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+Oriya:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="volunteer">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <img class="page-hero-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Puri_Sea_Beach_viewed_from_the_light_house.jpg/1920px-Puri_Sea_Beach_viewed_from_the_light_house.jpg" alt="" aria-hidden="true" />
      <div class="wrap page-hero-content">
        <p class="kicker light" data-i18n="volKicker"></p>
        <h1 data-i18n="volTitle"></h1>
        <p data-i18n="volSub"></p>
      </div>
      <div class="ikat-band" aria-hidden="true"></div>
    </section>

    <section class="section">
      <div class="wrap form-layout">
        <form class="form-card reveal" data-form="Volunteer sign-up" novalidate>
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <h2 data-i18n="volFormTitle"></h2>
          <div class="grid-2">
            <label class="field"><span class="lbl"><span data-i18n="fFullName"></span> <em>*</em></span><input type="text" name="name" required autocomplete="name" /></label>
            <label class="field"><span class="lbl"><span data-i18n="fEmail"></span> <em>*</em></span><input type="email" name="email" required autocomplete="email" /></label>
            <label class="field"><span class="lbl"><span data-i18n="fPhone"></span></span><input type="tel" name="phone" autocomplete="tel" /></label>
            <label class="field"><span class="lbl"><span data-i18n="fCity"></span> <em>*</em></span><select name="city" required><option value="" data-i18n="select"></option><option>Surrey</option><option>Vancouver</option><option>Burnaby</option><option>Richmond</option><option>Coquitlam</option><option>Delta</option><option>Langley</option><option>New Westminster</option><option>North Vancouver</option><option>Abbotsford</option><option value="Other" data-i18n="other"></option></select></label>
          </div>
          <div class="field"><span class="lbl"><span data-i18n="fAreas"></span></span>
            <div class="check-pills"><label class="check-pill"><input type="checkbox" name="areas" value="Event setup &amp; logistics" /><span data-i18n="aEvents"></span></label><label class="check-pill"><input type="checkbox" name="areas" value="Food &amp; hospitality" /><span data-i18n="aFood"></span></label><label class="check-pill"><input type="checkbox" name="areas" value="Stage &amp; cultural programs" /><span data-i18n="aStage"></span></label><label class="check-pill"><input type="checkbox" name="areas" value="Photography &amp; video" /><span data-i18n="aPhoto"></span></label><label class="check-pill"><input type="checkbox" name="areas" value="Kids’ activities &amp; Odia class" /><span data-i18n="aKids"></span></label><label class="check-pill"><input type="checkbox" name="areas" value="Website &amp; social media" /><span data-i18n="aTech"></span></label><label class="check-pill"><input type="checkbox" name="areas" value="Fundraising &amp; sponsorship" /><span data-i18n="aFund"></span></label></div>
          </div>
          <div class="field"><span class="lbl"><span data-i18n="fAvail"></span></span>
            <div class="check-pills"><label class="check-pill"><input type="checkbox" name="availability" value="Weekends" /><span data-i18n="availWeekends"></span></label><label class="check-pill"><input type="checkbox" name="availability" value="Weekday evenings" /><span data-i18n="availWeekdays"></span></label><label class="check-pill"><input type="checkbox" name="availability" value="Only during major events" /><span data-i18n="availEvents"></span></label></div>
          </div>
          <label class="field"><span class="lbl"><span data-i18n="fSkills"></span></span><textarea name="skills" rows="4"></textarea></label>
          <button type="submit" class="btn btn-primary" data-i18n="volSubmit"></button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>

        <aside class="contrib reveal">
          <h2 data-i18n="contribTitle"></h2>
          <p data-i18n="contribBody"></p>
          <div class="contrib-card">
            <h3 data-i18n="contribMoney"></h3>
            <p data-i18n="contribMoneyBody"></p>
            <p class="etransfer"><span id="etransfer"></span><button type="button" class="copy-btn" id="copyEt" aria-label="Copy">⧉</button></p>
          </div>
          <div class="contrib-card">
            <h3 data-i18n="contribKind"></h3>
            <p data-i18n="contribKindBody"></p>
            <form data-form="Contribution offer" novalidate class="mini-form">
              <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
              <label class="field"><span class="lbl"><span data-i18n="fFullName"></span> <em>*</em></span><input type="text" name="name" required /></label>
              <label class="field"><span class="lbl"><span data-i18n="fEmail"></span> <em>*</em></span><input type="email" name="email" required /></label>
              <label class="field"><span class="lbl"><span data-i18n="fContribType"></span></span>
                <select name="contribution_type"><option value="Goods / in-kind" data-i18n="ctKind"></option><option value="Professional skills" data-i18n="ctSkills"></option><option value="Monetary pledge" data-i18n="ctMoney"></option></select></label>
              <label class="field"><span class="lbl"><span data-i18n="fDetails"></span> <em>*</em></span><textarea name="details" rows="4" required></textarea></label>
              <button type="submit" class="btn btn-gold" data-i18n="contribSubmit"></button>
              <p class="form-status" role="status" aria-live="polite"></p>
            </form>
          </div>
        </aside>
      </div>
    </section>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const et = window.VOCA_CONFIG.etransferEmail;
        document.getElementById("etransfer").textContent = et;
        document.getElementById("copyEt").addEventListener("click", (e) => {
          navigator.clipboard?.writeText(et); e.target.textContent = "✓";
        });
      });
    </script>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/odisha.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
