<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VOCA · Vancouver Odia Cultural Association</title>
  <meta name="description" content="Vancouver Odia Cultural Association (VOCA) — a non-profit cultural association in Surrey, BC, celebrating Odia language, music, dance and festivals in Canada." />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaina+2:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+Oriya:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="index">
  <div id="site-header"></div>

  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="hero-media" aria-hidden="true">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Konarka_Temple.jpg/1920px-Konarka_Temple.jpg" alt="" />
      </div>
      <div class="hero-shade" aria-hidden="true"></div>
      <svg class="hero-wheel" viewBox="0 0 100 100" aria-hidden="true"><use href="#wheel" /></svg>
      <div class="wrap hero-content">
        <p class="eyebrow" data-i18n="heroEyebrow">Surrey · British Columbia · Canada</p>
        <h1 data-i18n="heroTitle">Odisha’s heart, beating in Canada</h1>
        <p class="hero-lede" data-i18n="heroLede"></p>
        <div class="hero-cta">
          <a href="register.html" class="btn btn-primary" data-i18n="ctaJoin">Become a member</a>
          <a href="events.html" class="btn btn-ghost" data-i18n="ctaExplore">Upcoming events</a>
        </div>
      </div>
      <div class="ikat-band" aria-hidden="true"></div>
    </section>

    <!-- About -->
    <section class="section about">
      <div class="wrap about-grid">
        <div class="about-copy reveal">
          <p class="kicker" data-i18n="aboutKicker"></p>
          <h2 data-i18n="aboutTitle"></h2>
          <p data-i18n="aboutP1"></p>
          <p data-i18n="aboutP2"></p>
          <blockquote class="odia-quote">
            <span lang="or">ବନ୍ଦେ ଉତ୍କଳ ଜନନୀ</span>
            <small data-i18n="quoteNote"></small>
          </blockquote>
        </div>
        <div class="about-art reveal">
          <figure class="patta-frame">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Gotipua_dance_in_Raghurajpur_ei2-39.jpg/960px-Gotipua_dance_in_Raghurajpur_ei2-39.jpg" alt="Gotipua dancers performing in Raghurajpur, Odisha" loading="lazy" />
            <figcaption data-i18n="aboutFig"></figcaption>
          </figure>
          <figure class="patta-frame small">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/Odisha_Pattachitara_Depicting_Unconditional_Love_between_Radha_Krushna.jpg/960px-Odisha_Pattachitara_Depicting_Unconditional_Love_between_Radha_Krushna.jpg" alt="A Pattachitra painting from Odisha" loading="lazy" />
          </figure>
        </div>
      </div>
    </section>

    <!-- Moments carousel -->
    <section class="section moments">
      <div class="wrap">
        <header class="section-head reveal">
          <p class="kicker" data-i18n="momentsKicker"></p>
          <h2 data-i18n="momentsTitle"></h2>
        </header>
        <div id="moments" class="reveal"></div>
        <p class="center-link"><a href="gallery.html" class="btn btn-outline" data-i18n="discMore"></a></p>
      </div>
    </section>

    <div class="jhoti-divider" aria-hidden="true"></div>

    <!-- Why join -->
    <section class="section why">
      <div class="wrap">
        <header class="section-head reveal">
          <p class="kicker" data-i18n="whyKicker"></p>
          <h2 data-i18n="whyTitle"></h2>
        </header>
        <div class="pillars">
          <article class="pillar reveal">
            <div class="pillar-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 4c6 8 6 14 0 20-6-6-6-12 0-20Zm0 20c8-2 14 1 18 8-8 2-14-1-18-8Zm0 0c-8-2-14 1-18 8 8 2 14-1 18-8ZM24 24v20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
            <h3 data-i18n="p1Title"></h3><p data-i18n="p1Body"></p>
          </article>
          <article class="pillar reveal">
            <div class="pillar-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="32" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M4 40c1-8 6-12 12-12s11 4 12 12M20 40c1-8 6-12 12-12s11 4 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
            <h3 data-i18n="p2Title"></h3><p data-i18n="p2Body"></p>
          </article>
          <article class="pillar reveal">
            <div class="pillar-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 40h32M12 40V22l12-14 12 14v18M18 40V28h12v12M24 8V3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M24 3l6 3-6 3" fill="currentColor"/></svg></div>
            <h3 data-i18n="p3Title"></h3><p data-i18n="p3Body"></p>
          </article>
          <article class="pillar reveal">
            <div class="pillar-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M6 26l10-10 8 6 8-6 10 10-14 14a4 4 0 0 1-6 0L6 26Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M18 30l4 4M22 26l4 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
            <h3 data-i18n="p4Title"></h3><p data-i18n="p4Body"></p>
          </article>
          <article class="pillar reveal">
            <div class="pillar-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M4 30c6-10 14-10 20 0s14 10 20 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M14 22V10M34 22V10M10 10h8M30 10h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
            <h3 data-i18n="p5Title"></h3><p data-i18n="p5Body"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- Upcoming events -->
    <section class="section upcoming">
      <div class="wrap">
        <header class="section-head row reveal">
          <div>
            <p class="kicker" data-i18n="upKicker"></p>
            <h2 data-i18n="upTitle"></h2>
          </div>
          <a href="events.html" class="btn btn-outline" data-i18n="seeAllEvents"></a>
        </header>
        <div class="event-list" id="upcoming"></div>
      </div>
    </section>

    <!-- Festival wheel -->
    <section class="section festivals">
      <div class="wrap festivals-grid">
        <div class="wheel-stage reveal">
          <svg class="konark" viewBox="0 0 400 400" role="img" aria-label="Konark wheel festival calendar">
            <g id="konarkRotor">
              <circle cx="200" cy="200" r="188" class="k-rim-outer" />
              <circle cx="200" cy="200" r="170" class="k-rim" />
              <circle cx="200" cy="200" r="150" class="k-rim-inner" />
              <g id="konarkSpokes"></g>
              <circle cx="200" cy="200" r="44" class="k-hub" />
              <circle cx="200" cy="200" r="30" class="k-hub-inner" />
              <circle cx="200" cy="200" r="10" class="k-axle" />
            </g>
          </svg>
          <p class="wheel-hint" data-i18n="wheelHint"></p>
        </div>
        <div class="fest-panel reveal">
          <p class="kicker light" data-i18n="festKicker"></p>
          <h2 data-i18n="festTitle"></h2>
          <p class="fest-intro" data-i18n="festIntro"></p>
          <div class="fest-card" id="festCard" aria-live="polite">
            <p class="fest-month" id="festMonth"></p>
            <h3 id="festName"></h3>
            <p id="festBody"></p>
            <span class="fest-badge" id="festBadge" data-i18n="vocaCelebrates"></span>
          </div>
          <div class="fest-nav">
            <button class="round-btn" id="festPrev" aria-label="Previous festival">‹</button>
            <div class="fest-dots" id="festDots"></div>
            <button class="round-btn" id="festNext" aria-label="Next festival">›</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Discover Odisha -->
    <section class="section discover">
      <div class="wrap">
        <header class="section-head reveal">
          <p class="kicker" data-i18n="discKicker"></p>
          <h2 data-i18n="discTitle"></h2>
          <p class="section-sub" data-i18n="discSub"></p>
        </header>
        <div class="gallery" id="gallery"></div>
        <p class="center-link"><a href="gallery.html" class="btn btn-outline" data-i18n="discMore"></a></p>
      </div>
    </section>

    <!-- Get involved -->
    <section class="section involved">
      <div class="wrap">
        <header class="section-head reveal">
          <p class="kicker" data-i18n="involvedKicker"></p>
          <h2 data-i18n="involvedTitle"></h2>
        </header>
        <div class="involve-grid">
          <a href="register.html" class="involve-card reveal">
            <span class="involve-num" lang="or">୧</span>
            <h3 data-i18n="gi1Title"></h3><p data-i18n="gi1Body"></p><span class="involve-go" aria-hidden="true">→</span>
          </a>
          <a href="volunteer.html" class="involve-card reveal">
            <span class="involve-num" lang="or">୨</span>
            <h3 data-i18n="gi2Title"></h3><p data-i18n="gi2Body"></p><span class="involve-go" aria-hidden="true">→</span>
          </a>
          <a href="sponsors.html" class="involve-card reveal">
            <span class="involve-num" lang="or">୩</span>
            <h3 data-i18n="gi3Title"></h3><p data-i18n="gi3Body"></p><span class="involve-go" aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </section>

    <!-- Sponsors strip (hidden until data/sponsors.json has entries) -->
    <section class="section sponsor-strip" hidden>
      <div class="wrap">
        <p class="kicker" data-i18n="sponsorsStrip"></p>
        <div class="strip-logos" id="sponsorStrip"></div>
      </div>
    </section>

    <!-- Join banner -->
    <section class="join">
      <div class="ikat-band" aria-hidden="true"></div>
      <div class="wrap join-inner reveal">
        <svg class="join-wheel" viewBox="0 0 100 100" aria-hidden="true"><use href="#wheel" /></svg>
        <h2 data-i18n="joinTitle"></h2>
        <p data-i18n="joinBody"></p>
        <a href="register.html" class="btn btn-gold" data-i18n="joinBtn"></a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/odisha.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
